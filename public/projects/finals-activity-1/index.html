<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Activity</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>

    <main id="formbox">
        <img src="image/logo.png" alt="image1">

        <h1 id="firstname">Aljo</h1>
        <p id="subtitle">BS Computer Science</p>

        <input type="text" id="nameinput" placeholder="type your nickname">

        <select id="yearselect">
            <option value="" selected disabled>Select Year</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
        </select>

        <div id="buttons">
            <button id="clickbutton">Click</button>
            <button id="doubleclickbutton">DoubleClick</button>
            <button id="pressholdbutton">Press & Hold</button>
        </div>

        <p id="displayname"></p>
        <p id="webtext"></p>
    </main>

    <footer id="statusbar">You leave the Form</footer>

<script src="script.js"></script>
</body>
</html>
